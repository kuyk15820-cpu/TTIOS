name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: setup xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: show xcode version
        run: xcodebuild -version

      # 🟢 โหลด Hikari LLVM Toolchain จาก Release Zip โดยตรง
      - name: setup hikari llvm toolchain
        run: |
          mkdir -p ~/Library/Developer/Toolchains
          curl -L -o /tmp/Hikari.xctoolchain.zip https://github.com/Hikari-LLVM/Hikari/releases/download/15.0.0/Hikari_macOS.xctoolchain.zip || true
          if [ -f "/tmp/Hikari.xctoolchain.zip" ]; then
            unzip -q /tmp/Hikari.xctoolchain.zip -d ~/Library/Developer/Toolchains/
          fi

      - name: install ldid & swiftsecretkeys
        run: |
          brew install ldid
          git clone https://github.com/MatheusMBispo/SwiftSecretKeys.git /tmp/SwiftSecretKeys
          cd /tmp/SwiftSecretKeys
          swift build -c release
          sudo cp .build/release/sskeys /usr/local/bin/

      - name: generate secret keys
        run: sskeys generate

      - name: sync swift files to xcodeproj
        run: |
          gem install xcodeproj
          ruby << 'EOF'
          require 'xcodeproj'
          
          project_path = Dir.glob('*.xcodeproj').first
          unless project_path
            puts 'No .xcodeproj found'
            exit 1
          end

          project = Xcodeproj::Project.open(project_path)
          target = project.targets.first

          # 🟢 เพิ่ม Header Search Paths ให้ Xcode ค้นหาไฟล์ .h เจอในทุกโฟลเดอร์ย่อย
          target.build_configurations.each do |config|
            config.build_settings['HEADER_SEARCH_PATHS'] ||= '$(inherited)'
            paths = config.build_settings['HEADER_SEARCH_PATHS']
            paths = [paths] if paths.is_a?(String)
            unless paths.include?('$(SRCROOT)/**')
              config.build_settings['HEADER_SEARCH_PATHS'] = paths + ['$(SRCROOT)/**']
            end
          end

          # 🟢 1. สั่งเพิ่ม Swift Package (MBProgressHUD)
          mbph_url = 'https://github.com/jdg/MBProgressHUD.git'
          mbph_ref = project.root_object.package_references.find { |p| p.repositoryURL == mbph_url }
          unless mbph_ref
            mbph_ref = project.new(Xcodeproj::Project::Object::XCRemoteSwiftPackageReference)
            mbph_ref.repositoryURL = mbph_url
            mbph_ref.requirement = { 'kind' => 'upToNextMajorVersion', 'minimumVersion' => '1.2.0' }
            project.root_object.package_references << mbph_ref
            
            mbph_product_dependency = project.new(Xcodeproj::Project::Object::XCSwiftPackageProductDependency)
            mbph_product_dependency.product_name = 'MBProgressHUD'
            mbph_product_dependency.package = mbph_ref
            
            target.package_product_dependencies << mbph_product_dependency
            puts 'Added Swift Package: MBProgressHUD'
          end

          # 🟢 2. สั่งเพิ่ม Swift Package (Drops)
          drops_url = 'https://github.com/omaralbeik/Drops.git'
          drops_ref = project.root_object.package_references.find { |p| p.repositoryURL == drops_url }
          unless drops_ref
            drops_ref = project.new(Xcodeproj::Project::Object::XCRemoteSwiftPackageReference)
            drops_ref.repositoryURL = drops_url
            drops_ref.requirement = { 'kind' => 'upToNextMajorVersion', 'minimumVersion' => '1.7.0' }
            project.root_object.package_references << drops_ref
            
            drops_product_dependency = project.new(Xcodeproj::Project::Object::XCSwiftPackageProductDependency)
            drops_product_dependency.product_name = 'Drops'
            drops_product_dependency.package = drops_ref
            
            target.package_product_dependencies << drops_product_dependency
            puts 'Added Swift Package: Drops'
          end

          # 🟢 3. สั่งเพิ่ม Swift Package (SwiftySegmentedPicker -> Product Name: SegmentedPicker)
          ssp_url = 'https://github.com/KazaiMazai/SwiftySegmentedPicker.git'
          ssp_ref = project.root_object.package_references.find { |p| p.repositoryURL == ssp_url }
          unless ssp_ref
            ssp_ref = project.new(Xcodeproj::Project::Object::XCRemoteSwiftPackageReference)
            ssp_ref.repositoryURL = ssp_url
            ssp_ref.requirement = { 'kind' => 'branch', 'branch' => 'main' }
            project.root_object.package_references << ssp_ref
            
            ssp_product_dependency = project.new(Xcodeproj::Project::Object::XCSwiftPackageProductDependency)
            ssp_product_dependency.product_name = 'SegmentedPicker'
            ssp_product_dependency.package = ssp_ref
            
            target.package_product_dependencies << ssp_product_dependency
            puts 'Added Swift Package: SegmentedPicker'
          end

          # 🟢 4. สั่งเพิ่ม Swift Package (swiftui-particles -> Product Name: Particles)
          particles_url = 'https://github.com/benlmyers/swiftui-particles.git'
          particles_ref = project.root_object.package_references.find { |p| p.repositoryURL == particles_url }
          unless particles_ref
            particles_ref = project.new(Xcodeproj::Project::Object::XCRemoteSwiftPackageReference)
            particles_ref.repositoryURL = particles_url
            particles_ref.requirement = { 'kind' => 'branch', 'branch' => 'main' }
            project.root_object.package_references << particles_ref
            
            particles_product_dependency = project.new(Xcodeproj::Project::Object::XCSwiftPackageProductDependency)
            particles_product_dependency.product_name = 'Particles'
            particles_product_dependency.package = particles_ref
            
            target.package_product_dependencies << particles_product_dependency
            puts 'Added Swift Package: Particles'
          end

          # 🟢 5. สั่งเพิ่ม Swift Package (SwiftDate)
          swiftdate_url = 'https://github.com/malcommac/SwiftDate.git'
          swiftdate_ref = project.root_object.package_references.find { |p| p.repositoryURL == swiftdate_url }
          unless swiftdate_ref
            swiftdate_ref = project.new(Xcodeproj::Project::Object::XCRemoteSwiftPackageReference)
            swiftdate_ref.repositoryURL = swiftdate_url
            swiftdate_ref.requirement = { 'kind' => 'upToNextMajorVersion', 'minimumVersion' => '7.0.0' }
            project.root_object.package_references << swiftdate_ref
            
            swiftdate_product_dependency = project.new(Xcodeproj::Project::Object::XCSwiftPackageProductDependency)
            swiftdate_product_dependency.product_name = 'SwiftDate'
            swiftdate_product_dependency.package = swiftdate_ref
            
            target.package_product_dependencies << swiftdate_product_dependency
            puts 'Added Swift Package: SwiftDate'
          end

          # 🟢 6. สั่งเพิ่ม Swift Package (TrustKit)
          trustkit_url = 'https://github.com/datatheorem/TrustKit.git'
          trustkit_ref = project.root_object.package_references.find { |p| p.repositoryURL == trustkit_url }
          unless trustkit_ref
            trustkit_ref = project.new(Xcodeproj::Project::Object::XCRemoteSwiftPackageReference)
            trustkit_ref.repositoryURL = trustkit_url
            trustkit_ref.requirement = { 'kind' => 'upToNextMajorVersion', 'minimumVersion' => '3.0.7' }
            project.root_object.package_references << trustkit_ref
            
            trustkit_product_dependency = project.new(Xcodeproj::Project::Object::XCSwiftPackageProductDependency)
            trustkit_product_dependency.product_name = 'TrustKit'
            trustkit_product_dependency.package = trustkit_ref
            
            target.package_product_dependencies << trustkit_product_dependency
            puts 'Added Swift Package: TrustKit'
          end

          # 🟢 7. Sync ไฟล์ .swift, .m, .mm, .cpp และ .h เข้า Compile Sources และ Project
          source_phase = target.source_build_phase
          existing_files = source_phase.files_references.compact.map(&:real_path).compact.map(&:to_s)

          Dir.glob('**/*.{swift,m,mm,cpp,h}').each do |source_file|
            next if source_file.start_with?('Pods/', 'Build/', '.build/', 'DerivedData/')
            
            file_abs_path = File.expand_path(source_file)

            file_ref = project.files.find { |f| f.real_path.to_s == file_abs_path }
            unless file_ref
              file_ref = project.main_group.new_file(source_file)
            end

            if source_file.end_with?('.swift', '.m', '.mm', '.cpp')
              unless existing_files.include?(file_abs_path) || source_phase.files_references.include?(file_ref)
                source_phase.add_file_reference(file_ref)
                puts "Added to compile sources: #{source_file}"
              end
            elsif source_file.end_with?('.h')
              puts "Added header reference to project: #{source_file}"
            end
          end

          project.save
          EOF

      - name: build
        run: |
          chmod +x scripts/build_ipa.sh
          ./scripts/build_ipa.sh

      - name: upload artifact (PR only)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: app-ipa
          path: |
            build/*.ipa

      - name: upload release ipa
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: release-ipa
          path: build/*.ipa


  release:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: download ipa
        uses: actions/download-artifact@v4
        with:
          name: release-ipa
          path: build/

      - name: get last 12h commits
        run: |
          COMMITS=$(git log --since="12 hours ago" --pretty=format:"- %h %s (%an)")
          if [ -z "$COMMITS" ]; then
            COMMITS="no commits in the last 12 hours"
          fi

          echo "COMMITS<<EOF" >> $GITHUB_ENV
          echo "$COMMITS" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: write release notes
        run: |
          cat <<EOF > release_notes.txt
          Nightly build
          
          Last 12 hours commits:
          
          ${COMMITS}
          EOF

      - name: update nightly release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view nightly >/dev/null 2>&1 || \
          gh release create nightly \
            --title "Nightly" \
            --notes "initial nightly" \
            --prerelease
      
          gh release edit nightly \
            --title "Nightly" \
            --notes-file release_notes.txt \
            --prerelease      
          
          for asset in $(gh release view nightly --json assets -q '.assets[].name'); do
            echo "Deleting old asset: $asset"
            gh release delete-asset nightly "$asset" -y || true
          done

          gh release upload nightly build/*.ipa --clobber
